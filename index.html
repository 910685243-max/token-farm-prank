<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分刷取中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  .card {
    width: 420px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .header p { color: #aaa; font-size: 13px; margin-top: 6px; }
  .balance-box {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px dashed rgba(255,215,0,0.4);
  }
  .balance-box .label { color: #bbb; font-size: 13px; }
  .balance-box .value {
    font-size: 34px;
    font-weight: bold;
    color: #ffd700;
    margin-top: 4px;
  }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: #ccc; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: #ffd700; }
  .field input::placeholder { color: #777; }
  .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .option {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
  }
  .option .num { font-size: 18px; font-weight: bold; color: #ffd700; }
  .option .unit { font-size: 11px; color: #aaa; }
  .option.active { border-color: #ffd700; background: rgba(255,215,0,0.15); box-shadow: 0 0 12px rgba(255,215,0,0.3); }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    color: #222;
    margin-top: 8px;
    transition: 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,140,0,0.4); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .progress-wrap { margin-top: 18px; display: none; }
  .progress-bar {
    height: 14px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    transition: width 0.1s;
  }
  .progress-text { text-align: center; font-size: 13px; color: #aaa; margin-top: 8px; }
  .result {
    text-align: center;
    margin-top: 16px;
    font-size: 15px;
    display: none;
    padding: 12px;
    border-radius: 10px;
  }
  .result.success { background: rgba(0,255,100,0.15); color: #7dffa0; border: 1px solid rgba(0,255,100,0.3); }
  .result.error { background: rgba(255,0,0,0.15); color: #ff9090; border: 1px solid rgba(255,0,0,0.3); }
  .note {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #666;
  }
  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: #555;
  }

  /* 连接服务器倒计时遮罩 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 20, 0.92);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
  }
  .overlay.show { display: flex; }
  .spinner {
    width: 70px;
    height: 70px;
    border: 5px solid rgba(255,215,0,0.2);
    border-top-color: #ffd700;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .countdown-num {
    font-size: 56px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
  }
  .countdown-status {
    margin-top: 16px;
    font-size: 15px;
    color: #ddd;
    letter-spacing: 1px;
  }
  .countdown-dots { color: #ffd700; }
  .countdown-detail {
    margin-top: 8px;
    font-size: 12px;
    color: #888;
    font-family: Consolas, monospace;
  }

  /* 刷取成功弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 340px;
    background: linear-gradient(160deg, #1a1a2e, #302b63);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 18px;
    padding: 28px 24px 22px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,215,0,0.2);
    animation: popIn 0.4s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal-icon {
    font-size: 56px;
    margin-bottom: 10px;
    animation: bounce 1s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .modal-title {
    font-size: 22px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .modal-sub {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 16px;
  }
  .modal-info {
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    color: #ddd;
    text-align: left;
    margin-bottom: 18px;
    font-family: Consolas, monospace;
  }
  .modal-info div { display: flex; justify-content: space-between; margin: 4px 0; }
  .modal-info span:first-child { color: #888; }
  .modal-info span:last-child { color: #ffd700; }
  .modal-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    color: #222;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255,140,0,0.4); }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>⚡ 积分刷取中心</h1>
    <p>极速刷取 · 秒到账 · 无需等待</p>
  </div>

  <div class="balance-box">
    <div class="label">您的剩余积分</div>
    <div class="value" id="balance">888</div>
  </div>

  <div class="field">
    <label>请输入充值 API 密钥</label>
    <input type="text" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxxxxxx">
  </div>

  <div class="field">
    <label>选择充值数量</label>
    <div class="options" id="options">
      <div class="option" data-val="1000"><div class="num">1000</div><div class="unit">积分</div></div>
      <div class="option active" data-val="10000"><div class="num">10000</div><div class="unit">积分</div></div>
      <div class="option" data-val="100000"><div class="num">100000</div><div class="unit">积分</div></div>
    </div>
  </div>

  <button class="btn" id="btn" onclick="start()">🚀 开始刷取</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">正在连接服务器...</div>
  </div>

  <div class="result success" id="resultSuccess">✅ 刷取成功！积分已到账 ~</div>
  <div class="result error" id="resultError">❌ 错误：API 密钥无效，请检查后重试</div>

  <div class="note">本页面仅供娱乐恶搞，请勿用于真实用途 😜</div>
  <div class="footer">Copyright © 2026 · 积分刷取中心™</div>
</div>

<!-- 倒计时遮罩 -->
<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div class="countdown-num" id="countdownNum">5</div>
  <div class="countdown-status" id="countdownStatus">正在连接服务器<span class="countdown-dots">...</span></div>
  <div class="countdown-detail" id="countdownDetail">正在初始化连接...</div>
</div>

<!-- 刷取成功弹窗 -->
<div class="modal-mask" id="successModal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <div class="modal-title">刷取成功</div>
    <div class="modal-sub" id="modalSub">已成功分配 10000 积分</div>
    <div class="modal-info">
      <div><span>订单编号</span><span id="modalOrderId">TX20260807123456</span></div>
      <div><span>刷取数量</span><span id="modalAmount">+10000</span></div>
      <div><span>当前余额</span><span id="modalBalance">10,888</span></div>
      <div><span>处理节点</span><span>香港 03#</span></div>
    </div>
    <button class="modal-btn" onclick="confirmModal()">确认到账</button>
  </div>
</div>

<script>
  let balance = 888;
  let selected = 10000;
  let running = false;

  document.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', () => {
      if (running) return;
      document.querySelectorAll('.option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      selected = parseInt(opt.dataset.val);
    });
  });

  // 倒计时阶段的状态文案
  const COUNTDOWN_STEPS = [
    { num: 5, status: '正在连接服务器', detail: '正在初始化连接...' },
    { num: 4, status: '正在验证密钥', detail: '校验 API 密钥中...' },
    { num: 3, status: '正在建立加密通道', detail: 'TLS 握手进行中...' },
    { num: 2, status: '正在锁定刷取引擎', detail: '分配高速节点...' },
    { num: 1, status: '正在等待响应', detail: '服务器响应延迟...' },
  ];

  function start() {
    if (running) return;
    const apiKey = document.getElementById('apiKey').value.trim();
    document.getElementById('resultSuccess').style.display = 'none';
    document.getElementById('resultError').style.display = 'none';

    running = true;
    document.getElementById('btn').disabled = true;

    // 播放倒计时动画，结束后弹出"刷取成功"弹窗
    runCountdown(() => {
      showSuccessModal(apiKey);
    });
  }

  function showSuccessModal(apiKey) {
    // 弹窗前先更新余额（恶搞：假装已到账）
    balance += selected;
    document.getElementById('balance').textContent = balance;

    document.getElementById('modalAmount').textContent = '+' + selected.toLocaleString();
    document.getElementById('modalSub').textContent = '已成功分配 ' + selected.toLocaleString() + ' 积分';
    document.getElementById('modalBalance').textContent = balance.toLocaleString();
    document.getElementById('modalOrderId').textContent = 'TX' + Date.now() + Math.floor(Math.random() * 1000);

    document.getElementById('successModal').classList.add('show');
  }

  function confirmModal() {
    document.getElementById('successModal').classList.remove('show');
    startProgress();
  }

  function runCountdown(callback) {
    const overlay = document.getElementById('overlay');
    const numEl = document.getElementById('countdownNum');
    const statusEl = document.getElementById('countdownStatus');
    const detailEl = document.getElementById('countdownDetail');

    overlay.classList.add('show');
    let step = 0;

    function next() {
      if (step >= COUNTDOWN_STEPS.length) {
        overlay.classList.remove('show');
        callback();
        return;
      }
      const s = COUNTDOWN_STEPS[step];
      numEl.textContent = s.num;
      statusEl.innerHTML = s.status + '<span class="countdown-dots">...</span>';
      detailEl.textContent = s.detail;
      step++;
      setTimeout(next, 900);
    }
    next();
  }

  function startProgress() {
    document.getElementById('progressWrap').style.display = 'block';

    let progress = 0;
    const fill = document.getElementById('progressFill');
    const text = document.getElementById('progressText');

    const interval = setInterval(() => {
      progress += Math.random() * 8;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        finishFake();
      }
      fill.style.width = progress + '%';
      text.textContent = '正在刷取中... ' + Math.floor(progress) + '%';
    }, 120);
  }

  function finishFake() {
    document.getElementById('progressWrap').style.display = 'none';

    const s = document.getElementById('resultSuccess');
    s.textContent = '✅ 刷取成功！已到账 ' + selected.toLocaleString() + ' 积分，当前剩余 ' + balance.toLocaleString();
    s.style.display = 'block';

    running = false;
    document.getElementById('btn').disabled = false;
  }
</script>
</body>
</html>
